services:
  ollama:
    image: ollama/ollama:latest
    container_name: ia025_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done

        echo "Pulling generation model..."
        ollama pull "$$OLLAMA_MODEL"

        echo "Pulling embedding model..."
        ollama pull "$${RETRIEVAL_EMBEDDING_MODEL:-embeddinggemma:300m}"

        echo "Ollama models are ready."
        wait

  streamlit:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ia025_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    depends_on:
      - ollama

volumes:
  ollama_data: