services:
  ollama:
    image: ollama/ollama:latest
    container_name: ia025_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    env_file:
          - .env
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull $$OLLAMA_MODEL && wait" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  streamlit:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ia025_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    env_file:
      - .env

    depends_on:
      - ollama

volumes:
  ollama_data:
